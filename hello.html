<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Welcome</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --border: rgba(148, 163, 184, 0.16);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f8fafc;
        --bg-card: rgba(255, 255, 255, 0.85);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent: #0284c7;
        --accent-glow: rgba(2, 132, 199, 0.15);
        --border: rgba(15, 23, 42, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15), transparent 40%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .card {
      max-width: 540px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.75rem 2.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-secondary);
      font-size: 1.0625rem;
      margin-bottom: 1.75rem;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.875rem;
      margin-bottom: 2rem;
    }

    .feature-item {
      padding: 0.875rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .feature-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.2rem;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .timestamp {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>Ready</span>
    </div>
    <h1 id="greeting">Hello, World!</h1>
    <p>
      Welcome to the sample HTML page for <strong>test-cursor-cloud-agent</strong>.
      Built with clean semantic markup, responsive layout, and automatic light/dark mode support.
    </p>
    <section class="features" aria-label="Page highlights">
      <div class="feature-item">
        <span class="feature-label">Layout</span>
        Responsive Grid
      </div>
      <div class="feature-item">
        <span class="feature-label">Theme</span>
        Auto Light / Dark
      </div>
      <div class="feature-item">
        <span class="feature-label">Dependencies</span>
        Zero External
      </div>
    </section>
    <div class="actions">
      <button type="button" id="wave-btn">Cycle Greeting</button>
      <span class="timestamp" id="clock" aria-live="polite"></span>
    </div>
  </main>

  <script>
    const greetings = [
      "Hello, World!",
      "Welcome aboard!",
      "Hola, Mundo!",
      "Bonjour, le Monde!",
      "こんにちは世界！"
    ];
    let index = 0;
    const greetingEl = document.getElementById("greeting");
    const waveBtn = document.getElementById("wave-btn");
    const clockEl = document.getElementById("clock");

    waveBtn.addEventListener("click", () => {
      index = (index + 1) % greetings.length;
      greetingEl.textContent = greetings[index];
    });

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
